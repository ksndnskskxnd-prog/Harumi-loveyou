<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Galaxia de Amor ❤️</title>

<style>
body{
  margin:0;
  height:100vh;
  background: radial-gradient(circle at bottom, #0b0d2b, #000);
  overflow:hidden;
  font-family: Arial, sans-serif;
  color:white;
}

/* Corazon gigante */
.heart-big{
  position:absolute;
  width:220px;
  height:220px;
  background:#ff4d6d;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) rotate(45deg);
  animation: spin 18s linear infinite;
  box-shadow:0 0 80px rgba(255,77,109,0.9);
  z-index:2;
}
.heart-big::before,
.heart-big::after{
  content:"";
  position:absolute;
  width:220px;
  height:220px;
  background:#ff4d6d;
  border-radius:50%;
}
.heart-big::before{ top:-110px; left:0; }
.heart-big::after{ left:-110px; top:0; }

@keyframes spin{
  from{ transform:translate(-50%,-50%) rotate(45deg) rotate(0deg); }
  to{ transform:translate(-50%,-50%) rotate(45deg) rotate(360deg); }
}

/* Texto central */
.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  width:85%;
  max-width:540px;
  z-index:3;
}

.center h1{
  color:#ff9bd5;
}

.center p{
  line-height:1.8;
  font-size:18px;
}

/* Boton */
button{
  margin-top:20px;
  padding:14px 30px;
  border-radius:30px;
  border:none;
  background:#ff4d6d;
  color:white;
  font-size:18px;
  cursor:pointer;
}

/* Palabras flotando */
.love{
  position:absolute;
  font-size:20px;
  color:rgba(255,182,193,0.95);
  animation:floatLove linear infinite;
  white-space:nowrap;
}

/* Estrellas */
.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  border-radius:50%;
  opacity:0.8;
}

@keyframes floatLove{
  from{ bottom:-10%; opacity:0; }
  20%{ opacity:1; }
  to{ bottom:110%; opacity:0; transform:translateX(40px); }
}
</style>
</head>

<body>

<div class="heart-big"></div>

<div class="center" id="content">
  <h1> Para ti mi hermosa Harumi ❤️</h1>
  <button onclick="mostrarTexto()">Presiona aqui ✨</button>
</div>

<audio id="music" loop>
  <source src="https://files.catbox.moe/3j1x0p.mp3" type="audio/mpeg">
</audio>

<script>
function mostrarTexto(){
  var music = document.getElementById("music");
  music.play();

  var content = document.getElementById("content");
  content.innerHTML =
  "<p>" +
  "Nuestro primer mes juntos es una de las cosas mas bonitas que me han pasado en la vida ❤️.<br><br>" +
  "Desde que llegaste, todo se siente mas claro, mas calido y mas lleno de amor. " +
  "Me encantas de una forma sincera y profunda, de esas que no se fuerzan, solo se sienten .<br><br>" +
  "Quiero que lo nuestro dure para siempre, quiero seguir construyendo contigo, " +
  "elegirte cada dia y cuidarte con el corazon. Eres lo mejor que me ha pasado " +
  "y no hay nada que valore mas que este amor tan nuestro ✨.<br><br>" +
  "Usted es solamente mia, asi como yo tambien lo soy, porque cuando dos corazones " +
  "se eligen por amor, se pertenecen de la forma mas bonita que existe .<br><br>" +
  "Este primer mes es solo el comienzo, y quiero que sigamos escribiendo esta historia " +
  "juntos, con paciencia, ternura y muchisimo amor ." +
  "</p>" +
  "<h2 style='color:#ff9bd5;'>Te amo mi hermosa mujer ❤️</h2>";
}

/* Palabras flotando */
var frases = [
  "Te amo ",
  "Me encantas ",
  "Mi amor ❤️",
  "Te adoro ",
  "Solo tu "
];

function crearAmor(){
  var l = document.createElement("div");
  l.className = "love";
  l.innerText = frases[Math.floor(Math.random()*frases.length)];
  l.style.left = Math.random()*100 + "vw";
  l.style.animationDuration = (Math.random()*5 + 6) + "s";
  document.body.appendChild(l);
  setTimeout(function(){ l.remove(); }, 10000);
}

/* Estrellas */
for(var i=0;i<180;i++){
  var s = document.createElement("div");
  s.className = "star";
  s.style.left = Math.random()*100 + "vw";
  s.style.top = Math.random()*100 + "vh";
  document.body.appendChild(s);
}

setInterval(crearAmor, 350);
</script>

</body>
</html>
